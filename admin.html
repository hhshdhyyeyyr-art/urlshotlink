<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeleShort - Premium Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Monetag Script for Admin Ad testing -->
    <script src='//libtl.com/sdk.js' data-zone='11645333' data-sdk='show_11645333'></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #080f1e; color: #f8fafc; }
        .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 1.25rem; }
        .premium-text { background: linear-gradient(to right, #818cf8, #2dd4bf); -webkit-background-clip: text; color: transparent; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #080f1e; }
        ::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 10px; }
        /* Custom Toast CSS */
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast { padding: 16px 24px; border-radius: 12px; font-size: 14px; font-weight: 600; color: white; display: flex; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transform: translateX(120%); opacity: 0; transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55); backdrop-filter: blur(10px); }
        .toast.show { transform: translateX(0); opacity: 1; }
        .toast-success { background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981; }
        .toast-error { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; }
        .toast-info { background: rgba(99, 102, 241, 0.2); border: 1px solid #6366f1; }
        .nav-btn.active { background: linear-gradient(135deg, #4f46e5, #3b82f6); color: white; box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4); }
    </style>
</head>
<body class="flex h-screen overflow-hidden relative">
    
    <!-- Background Glow -->
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-indigo-600/20 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-teal-600/10 rounded-full blur-[120px] pointer-events-none"></div>

    <!-- TOAST CONTAINER -->
    <div id="toast-container"></div>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="absolute inset-0 z-50 bg-[#080f1e]/90 backdrop-blur-xl flex items-center justify-center transition-all duration-500">
        <div class="glass-panel p-10 max-w-sm w-full text-center shadow-[0_0_50px_rgba(79,70,229,0.15)] border border-indigo-500/20">
            <div class="w-20 h-20 mx-auto bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center mb-6 shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-fingerprint text-4xl text-white"></i>
            </div>
            <h2 class="text-3xl font-extrabold mb-2 premium-text">Admin Portal</h2>
            <p class="text-slate-400 text-sm mb-8">Authenticate to access dashboard</p>
            <input type="password" id="admin-password" placeholder="••••••••" class="w-full bg-[#0b1325] border border-slate-700/50 text-white px-4 py-4 rounded-xl mb-6 focus:outline-none focus:border-indigo-500 text-center tracking-[0.5em] text-lg shadow-inner transition-colors">
            <button id="btn-login" class="w-full bg-gradient-to-r from-indigo-600 to-blue-500 hover:from-indigo-500 hover:to-blue-400 text-white font-bold py-4 rounded-xl transition-all shadow-lg hover:shadow-indigo-500/25 active:scale-95">Secure Login <i class="fa-solid fa-arrow-right ml-2"></i></button>
        </div>
    </div>

    <!-- ADMIN DASHBOARD -->
    <div id="admin-dashboard" class="flex w-full h-full hidden z-10">
        <!-- Desktop Sidebar -->
        <aside class="w-72 bg-[#0b1325]/80 backdrop-blur-md border-r border-slate-800 p-6 hidden md:flex flex-col">
            <div class="flex items-center mb-10 px-2">
                <div class="w-10 h-10 bg-indigo-500 rounded-lg flex items-center justify-center mr-3 shadow-lg shadow-indigo-500/30"><i class="fa-solid fa-bolt text-white"></i></div>
                <div><h1 class="text-xl font-bold text-white">TeleAdmin</h1><div class="flex items-center text-[10px] text-emerald-400"><div class="w-2 h-2 bg-emerald-500 rounded-full mr-1 animate-pulse"></div> DB Connected</div></div>
            </div>
            <nav class="space-y-3 flex-1">
                <button class="nav-btn w-full text-left px-5 py-3.5 rounded-xl font-medium text-slate-400 hover:bg-slate-800/50 transition-all flex items-center active" onclick="switchTab('dashboard', this)"><i class="fa-solid fa-chart-pie w-6"></i> Dashboard</button>
                <button class="nav-btn w-full text-left px-5 py-3.5 rounded-xl font-medium text-slate-400 hover:bg-slate-800/50 transition-all flex items-center" onclick="switchTab('users', this)"><i class="fa-solid fa-users w-6"></i> Users List</button>
                <button class="nav-btn w-full text-left px-5 py-3.5 rounded-xl font-medium text-slate-400 hover:bg-slate-800/50 transition-all flex items-center" onclick="switchTab('withdrawals', this)"><i class="fa-solid fa-money-bill-transfer w-6"></i> Withdrawals</button>
                <button class="nav-btn w-full text-left px-5 py-3.5 rounded-xl font-medium text-slate-400 hover:bg-slate-800/50 transition-all flex items-center" onclick="switchTab('settings', this)"><i class="fa-solid fa-gear w-6"></i> App Settings</button>
                <button class="nav-btn w-full text-left px-5 py-3.5 rounded-xl font-medium text-slate-400 hover:bg-slate-800/50 transition-all flex items-center" onclick="switchTab('broadcast', this)"><i class="fa-solid fa-bullhorn w-6 text-amber-400"></i> Broadcast</button>
                <button class="nav-btn w-full text-left px-5 py-3.5 rounded-xl font-medium text-slate-400 hover:bg-slate-800/50 transition-all flex items-center" onclick="switchTab('tools', this)"><i class="fa-solid fa-screwdriver-wrench w-6 text-teal-400"></i> Owner Tools</button>
            </nav>
            <button class="w-full text-left p-4 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-400 transition border border-red-500/20 flex items-center justify-center font-bold" onclick="location.reload()"><i class="fa-solid fa-power-off mr-2"></i> Lock Panel</button>
        </aside>

        <!-- Mobile Header & Main -->
        <div class="md:hidden flex flex-col w-full h-full">
            <header class="flex justify-between items-center bg-[#0b1325] p-4 border-b border-slate-800">
                <span class="font-bold text-white flex items-center"><i class="fa-solid fa-bolt text-indigo-500 mr-2"></i>TeleAdmin</span>
                <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse shadow-[0_0_10px_#10b981]"></div>
            </header>
            <div class="flex space-x-2 text-sm overflow-x-auto whitespace-nowrap p-3 bg-[#0b1325]/80 backdrop-blur-sm border-b border-slate-800/50">
                <button class="nav-btn bg-indigo-600 px-4 py-2 rounded-lg text-white font-medium active" onclick="switchTab('dashboard', this)">Dash</button>
                <button class="nav-btn text-slate-400 px-4 py-2 rounded-lg bg-slate-800/50" onclick="switchTab('users', this)">Users</button>
                <button class="nav-btn text-slate-400 px-4 py-2 rounded-lg bg-slate-800/50" onclick="switchTab('withdrawals', this)">Payouts</button>
                <button class="nav-btn text-slate-400 px-4 py-2 rounded-lg bg-slate-800/50" onclick="switchTab('settings', this)">Settings</button>
                <button class="nav-btn text-slate-400 px-4 py-2 rounded-lg bg-slate-800/50" onclick="switchTab('tools', this)">Tools</button>
            </div>
            <main id="mobile-main" class="flex-1 overflow-y-auto p-4"></main>
        </div>

        <!-- Desktop Main -->
        <main id="desktop-main" class="hidden md:block flex-1 p-10 overflow-y-auto bg-transparent relative z-10"></main>
    </div>

    <!-- ============================================== -->
    <!-- TEMPLATES FOR TABS                             -->
    <!-- ============================================== -->

    <!-- TAB: DASHBOARD -->
    <template id="tpl-dashboard">
        <h2 class="text-3xl font-bold mb-8 premium-text">Real-Time Overview</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
            <div class="glass-panel p-6 border-t-4 border-t-indigo-500 shadow-xl flex justify-between items-center group hover:-translate-y-1 transition-transform">
                <div><div class="text-slate-400 text-xs font-bold uppercase mb-1 tracking-wider">Total Users</div><div class="text-4xl font-black text-white" id="stat-total-users">0</div></div>
                <div class="bg-indigo-500/20 w-14 h-14 rounded-2xl flex items-center justify-center group-hover:scale-110 transition-transform"><i class="fa-solid fa-users text-indigo-400 text-2xl"></i></div>
            </div>
            <div class="glass-panel p-6 border-t-4 border-t-emerald-500 shadow-xl flex justify-between items-center group hover:-translate-y-1 transition-transform">
                <div><div class="text-slate-400 text-xs font-bold uppercase mb-1 tracking-wider">Active Today</div><div class="text-4xl font-black text-white" id="stat-active-users">0</div></div>
                <div class="bg-emerald-500/20 w-14 h-14 rounded-2xl flex items-center justify-center group-hover:scale-110 transition-transform"><i class="fa-solid fa-bolt text-emerald-400 text-2xl"></i></div>
            </div>
            <div class="glass-panel p-6 border-t-4 border-t-red-500 shadow-xl flex justify-between items-center group hover:-translate-y-1 transition-transform">
                <div><div class="text-slate-400 text-xs font-bold uppercase mb-1 tracking-wider">Blocked Users</div><div class="text-4xl font-black text-red-400" id="stat-blocked">0</div></div>
                <div class="bg-red-500/20 w-14 h-14 rounded-2xl flex items-center justify-center group-hover:scale-110 transition-transform"><i class="fa-solid fa-ban text-red-400 text-2xl"></i></div>
            </div>
            <div class="glass-panel p-6 border-t-4 border-t-green-500 shadow-xl flex justify-between items-center group hover:-translate-y-1 transition-transform">
                <div><div class="text-slate-400 text-xs font-bold uppercase mb-1 tracking-wider">Total Paid</div><div class="text-4xl font-black text-green-400" id="stat-paid">$0.00</div></div>
                <div class="bg-green-500/20 w-14 h-14 rounded-2xl flex items-center justify-center group-hover:scale-110 transition-transform"><i class="fa-solid fa-check-double text-green-400 text-2xl"></i></div>
            </div>
            <div class="glass-panel p-6 border-t-4 border-t-amber-500 shadow-xl flex justify-between items-center group hover:-translate-y-1 transition-transform">
                <div><div class="text-slate-400 text-xs font-bold uppercase mb-1 tracking-wider">Pending Payouts</div><div class="text-4xl font-black text-amber-400" id="stat-pending-amt">$0.00</div></div>
                <div class="bg-amber-500/20 w-14 h-14 rounded-2xl flex items-center justify-center group-hover:scale-110 transition-transform"><i class="fa-solid fa-clock text-amber-400 text-2xl"></i></div>
            </div>
        </div>
    </template>

    <!-- TAB: USERS -->
    <template id="tpl-users">
        <h2 class="text-3xl font-bold mb-6 premium-text">User Management</h2>
        <div class="glass-panel overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead class="bg-[#0b1325] text-slate-400 border-b border-slate-700/50 uppercase text-[10px] tracking-wider">
                        <tr><th class="p-5 font-bold">TG ID</th><th class="p-5 font-bold">Name</th><th class="p-5 font-bold">Balance</th><th class="p-5 font-bold">Status</th><th class="p-5 font-bold text-right">Action</th></tr>
                    </thead>
                    <tbody id="admin-users-list" class="divide-y divide-slate-800/50 bg-[#0f172a]/40">
                        <tr><td colspan="5" class="p-10 text-center text-slate-400"><i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2 block"></i> Fetching users...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </template>

    <!-- TAB: WITHDRAWALS -->
    <template id="tpl-withdrawals">
        <h2 class="text-3xl font-bold mb-6 premium-text">Withdrawal Requests</h2>
        <div class="glass-panel overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead class="bg-[#0b1325] text-slate-400 border-b border-slate-700/50 uppercase text-[10px] tracking-wider">
                        <tr><th class="p-5 font-bold">User</th><th class="p-5 font-bold">Details</th><th class="p-5 font-bold">Amount</th><th class="p-5 font-bold">Date</th><th class="p-5 font-bold text-center">Action</th></tr>
                    </thead>
                    <tbody id="admin-withdraw-list" class="divide-y divide-slate-800/50 bg-[#0f172a]/40">
                        <tr><td colspan="5" class="p-10 text-center text-slate-400"><i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2 block"></i> Loading requests...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </template>

    <!-- TAB: SETTINGS -->
    <template id="tpl-settings">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-3xl font-bold premium-text">App Customization</h2>
            <label class="flex items-center space-x-3 cursor-pointer bg-slate-900/80 backdrop-blur px-5 py-2.5 rounded-xl border border-slate-700 shadow-lg hover:bg-slate-800 transition-colors">
                <span class="text-sm font-bold text-slate-300 uppercase tracking-wider text-[11px]">Maintenance Mode</span>
                <input type="checkbox" id="set-maintenance" class="w-5 h-5 accent-red-500 rounded">
            </label>
        </div>

        <div class="glass-panel p-8 max-w-4xl shadow-2xl">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div><label class="block text-[11px] font-bold text-slate-400 mb-2 uppercase tracking-wider">Global CPM ($)</label><input type="number" step="0.01" id="set-cpm" class="w-full bg-[#0b1325] border border-slate-700 rounded-lg p-3.5 text-white focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition-all"></div>
                <div><label class="block text-[11px] font-bold text-slate-400 mb-2 uppercase tracking-wider">Referral Bonus (%)</label><input type="number" id="set-ref" class="w-full bg-[#0b1325] border border-slate-700 rounded-lg p-3.5 text-white focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition-all"></div>
                <div><label class="block text-[11px] font-bold text-slate-400 mb-2 uppercase tracking-wider">Min. Withdraw ($)</label><input type="number" step="0.5" id="set-min-with" class="w-full bg-[#0b1325] border border-slate-700 rounded-lg p-3.5 text-white focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition-all"></div>
            </div>
            
            <div class="border-t border-slate-800 pt-8 mb-8">
                <h3 class="text-sm font-bold text-indigo-400 mb-5 uppercase tracking-wider flex items-center"><i class="fa-solid fa-rectangle-ad mr-2"></i> Ads Control</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div><label class="block text-[11px] font-bold text-slate-400 mb-2 uppercase tracking-wider">Ads to Show (Per Link)</label><input type="number" id="set-ads" class="w-full bg-[#0b1325] border border-slate-700 rounded-lg p-3.5 text-white focus:border-indigo-500 outline-none transition-all"></div>
                    <div><label class="block text-[11px] font-bold text-slate-400 mb-2 uppercase tracking-wider">Ad Timer (Seconds)</label><input type="number" id="set-timer" class="w-full bg-[#0b1325] border border-slate-700 rounded-lg p-3.5 text-white focus:border-indigo-500 outline-none transition-all"></div>
                </div>
            </div>

            <div class="border-t border-slate-800 pt-8 mb-8">
                <h3 class="text-sm font-bold text-indigo-400 mb-5 uppercase tracking-wider flex items-center"><i class="fa-solid fa-link mr-2"></i> Social & Legal Links</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div><label class="block text-[11px] font-bold text-slate-400 mb-2 uppercase tracking-wider">Telegram Channel URL</label><input type="url" id="set-tg" class="w-full bg-[#0b1325] border border-slate-700 rounded-lg p-3.5 text-white focus:border-indigo-500 outline-none transition-all"></div>
                    <div><label class="block text-[11px] font-bold text-slate-400 mb-2 uppercase tracking-wider">YouTube Channel URL</label><input type="url" id="set-yt" class="w-full bg-[#0b1325] border border-slate-700 rounded-lg p-3.5 text-white focus:border-indigo-500 outline-none transition-all"></div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div><label class="block text-[11px] font-bold text-slate-400 mb-2 uppercase tracking-wider">Privacy Policy URL</label><input type="url" id="set-privacy" class="w-full bg-[#0b1325] border border-slate-700 rounded-lg p-3.5 text-white focus:border-indigo-500 outline-none transition-all"></div>
                    <div><label class="block text-[11px] font-bold text-slate-400 mb-2 uppercase tracking-wider">Terms of Service URL</label><input type="url" id="set-terms" class="w-full bg-[#0b1325] border border-slate-700 rounded-lg p-3.5 text-white focus:border-indigo-500 outline-none transition-all"></div>
                </div>
            </div>

            <div class="border-t border-slate-800 pt-8 mb-8">
                <label class="block text-[11px] font-bold text-slate-400 mb-2 uppercase tracking-wider">Allowed Payment Methods (Comma separated)</label>
                <input type="text" id="set-payments" class="w-full bg-[#0b1325] border border-slate-700 rounded-lg p-3.5 text-white focus:border-indigo-500 outline-none transition-all">
            </div>
            
            <button id="btn-save-settings" onclick="saveSettingsAction()" class="w-full bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 py-4 rounded-xl font-bold text-white shadow-xl hover:shadow-indigo-500/30 transition-all flex items-center justify-center active:scale-[0.98]">
                <i class="fa-solid fa-floppy-disk mr-2"></i> Save Configuration
            </button>
        </div>
    </template>

    <!-- TAB: BROADCAST -->
    <template id="tpl-broadcast">
        <h2 class="text-3xl font-bold mb-6 premium-text">Mass Broadcast</h2>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="glass-panel p-8">
                <div class="mb-5">
                    <label class="block text-[11px] font-bold text-slate-400 mb-2 uppercase tracking-wider">Image URL (Optional)</label>
                    <input type="url" id="bc-image" placeholder="https://example.com/image.jpg" class="w-full bg-[#0b1325] border border-slate-700 rounded-lg p-3.5 text-white focus:border-indigo-500 outline-none transition-all" oninput="updatePreview()">
                </div>
                <div class="mb-5">
                    <label class="block text-[11px] font-bold text-slate-400 mb-2 uppercase tracking-wider">Message Caption (HTML Supported)</label>
                    <textarea id="bc-caption" rows="5" placeholder="<b>Hello User!</b>&#10;Check out our new update. 🔥" class="w-full bg-[#0b1325] border border-slate-700 rounded-lg p-3.5 text-white focus:border-indigo-500 outline-none transition-all" oninput="updatePreview()"></textarea>
                </div>
                <div class="mb-6 p-5 bg-[#0b1325] rounded-xl border border-slate-700 shadow-inner">
                    <label class="flex items-center space-x-3 cursor-pointer mb-4">
                        <input type="checkbox" id="bc-btn-toggle" checked class="w-5 h-5 rounded accent-indigo-500" onchange="updatePreview()">
                        <span class="text-sm font-bold text-white">Include "👉 Open now 👈" Button</span>
                    </label>
                    <label class="block text-[11px] font-bold text-slate-400 mb-2 uppercase tracking-wider">Mini App URL</label>
                    <input type="url" id="bc-mini-app-url" value="https://urlshotlink.vercel.app/" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white text-sm focus:border-indigo-500 outline-none transition-all">
                </div>
                <button id="btn-send-broadcast" onclick="startBroadcast()" class="w-full bg-gradient-to-r from-amber-600 to-orange-500 hover:from-amber-500 hover:to-orange-400 py-4 rounded-xl font-bold text-white shadow-xl hover:shadow-amber-500/30 transition-all flex items-center justify-center active:scale-[0.98]">
                    <i class="fa-solid fa-paper-plane mr-2"></i> Launch Broadcast
                </button>
                <div id="bc-status" class="hidden mt-6 p-5 border border-indigo-500/30 bg-indigo-500/10 rounded-xl shadow-inner">
                    <div class="flex justify-between text-sm mb-2 font-bold text-white"><span>Progress: <span id="bc-percent" class="text-indigo-400">0%</span></span><span id="bc-count">0 / 0</span></div>
                    <div class="w-full bg-[#0b1325] rounded-full h-2.5 mb-4 overflow-hidden border border-slate-800"><div id="bc-bar" class="bg-gradient-to-r from-indigo-500 to-cyan-400 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div></div>
                    <div class="flex justify-between text-xs font-bold uppercase tracking-wider"><span class="text-emerald-400"><i class="fa-solid fa-check mr-1"></i> Sent: <span id="bc-sent">0</span></span><span class="text-red-400"><i class="fa-solid fa-xmark mr-1"></i> Failed: <span id="bc-failed">0</span></span></div>
                </div>
            </div>
            <div>
                <h3 class="text-[11px] font-bold text-slate-400 mb-4 uppercase tracking-wider text-center">Live Telegram Preview</h3>
                <div class="bg-[#0e1621] p-5 rounded-2xl border border-slate-700 max-w-sm mx-auto shadow-[0_20px_50px_rgba(0,0,0,0.5)] relative">
                    <div class="flex items-center space-x-3 mb-4 pb-4 border-b border-slate-800">
                        <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-indigo-600 to-blue-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20"><i class="fa-solid fa-robot text-xl"></i></div>
                        <div><div class="text-white font-bold text-sm">UrlShortenerfast_bot <i class="fa-solid fa-circle-check text-blue-400 text-xs ml-1"></i></div><div class="text-slate-400 text-[11px]">bot</div></div>
                    </div>
                    <div class="tg-bubble p-2 inline-block max-w-[95%] shadow-md">
                        <img id="prev-img" src="" class="hidden w-full rounded-lg mb-2 object-cover max-h-48">
                        <div id="prev-text" class="text-white text-sm break-words leading-relaxed px-1"></div>
                    </div>
                    <div id="prev-btn" class="mt-3 w-[95%] text-center bg-[#182533] hover:bg-[#202f40] text-blue-400 font-bold py-2.5 rounded-xl text-sm cursor-pointer border border-slate-700/50 shadow-sm transition-colors">👉 Open now 👈</div>
                </div>
            </div>
        </div>
    </template>

    <!-- NEW TAB: OWNER TOOLS (TESTING) -->
    <template id="tpl-tools">
        <h2 class="text-3xl font-bold mb-6 premium-text">Owner Diagnostics & Testing</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Bot Tester -->
            <div class="glass-panel p-8 border border-indigo-500/20 relative overflow-hidden group">
                <div class="absolute -right-10 -top-10 text-9xl text-indigo-500/5 group-hover:scale-110 transition-transform"><i class="fa-brands fa-telegram"></i></div>
                <h3 class="text-lg font-bold text-white mb-2 relative z-10"><i class="fa-solid fa-robot text-indigo-400 mr-2"></i>Telegram Bot Test</h3>
                <p class="text-xs text-slate-400 mb-6 relative z-10">Verify if your Bot Token is working correctly.</p>
                <input type="text" id="test-bot-token" placeholder="Bot Token (e.g. 123456:ABC...)" class="w-full bg-[#0b1325] border border-slate-700 rounded-lg p-3.5 text-white mb-4 text-sm outline-none focus:border-indigo-500 relative z-10">
                <input type="text" id="test-chat-id" placeholder="Your Telegram ID (e.g. 987654321)" class="w-full bg-[#0b1325] border border-slate-700 rounded-lg p-3.5 text-white mb-6 text-sm outline-none focus:border-indigo-500 relative z-10">
                <button onclick="testTelegramBot()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-500/20 transition-all relative z-10 active:scale-95"><i class="fa-solid fa-paper-plane mr-2"></i>Send Test Alert</button>
            </div>
            
            <!-- Ads Tester -->
            <div class="glass-panel p-8 border border-emerald-500/20 relative overflow-hidden group">
                <div class="absolute -right-10 -top-10 text-9xl text-emerald-500/5 group-hover:scale-110 transition-transform"><i class="fa-solid fa-money-bill-wave"></i></div>
                <h3 class="text-lg font-bold text-white mb-2 relative z-10"><i class="fa-solid fa-rectangle-ad text-emerald-400 mr-2"></i>Monetag Ads Test</h3>
                <p class="text-xs text-slate-400 mb-6 relative z-10">Simulate a live ad request to verify your Monetag zone (11645333) integration.</p>
                
                <div class="bg-[#0b1325] border border-slate-700 p-4 rounded-xl mb-6 relative z-10 flex items-center justify-between">
                    <div>
                        <div class="text-[10px] text-slate-500 font-bold uppercase tracking-wider mb-1">Loaded Script Zone</div>
                        <div class="text-emerald-400 font-mono font-bold text-sm">Zone: 11645333</div>
                    </div>
                    <i class="fa-solid fa-circle-check text-emerald-500 text-2xl"></i>
                </div>

                <button onclick="testAds()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-emerald-500/20 transition-all relative z-10 active:scale-95"><i class="fa-solid fa-play mr-2"></i>Trigger Live Ad</button>
                <div id="ad-test-result" class="mt-4 text-xs hidden font-mono p-4 rounded-xl bg-[#0b1325] border border-slate-700 relative z-10"></div>
            </div>
        </div>
    </template>

    <script>
        // --- PREMIIUM TOAST SYSTEM ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            let icon = type === 'success' ? '<i class="fa-solid fa-circle-check text-emerald-400 mr-3 text-lg"></i>' : type === 'error' ? '<i class="fa-solid fa-circle-exclamation text-red-400 mr-3 text-lg"></i>' : '<i class="fa-solid fa-circle-info text-indigo-400 mr-3 text-lg"></i>';
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `${icon} <span>${message}</span>`;
            container.appendChild(toast);
            
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        // --- API CONFIGURATION ---
        const SUPABASE_URL = 'https://hlwnbizaaabtoafzbbax.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_12kTf5tqSSw1CrVi7OFJMg_I6h0r1m9';
        const VERCEL_BROADCAST_API = 'https://urlshotlink.vercel.app/api/broadcast'; 
        const ADMIN_PASSWORD = "admin"; 
        
        let dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let settingsId = null;

        // LOGIN
        document.getElementById('btn-login').addEventListener('click', () => {
            if(document.getElementById('admin-password').value === ADMIN_PASSWORD) {
                document.getElementById('login-screen').classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => {
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('admin-dashboard').classList.remove('hidden');
                    switchTab('dashboard', document.querySelector('.nav-btn'));
                    showToast("Login Successful! Welcome to Admin Panel.", "success");
                }, 500);
            } else { showToast("Incorrect Password! Access Denied.", "error"); }
        });

        function getActiveMain() { return window.innerWidth < 768 ? document.getElementById('mobile-main') : document.getElementById('desktop-main'); }

        // TAB SWITCHER
        window.switchTab = function(tabName, btnEl) {
            document.querySelectorAll('.nav-btn').forEach(b => {
                b.classList.remove('active', 'bg-slate-800/50');
                if(!b.classList.contains('bg-indigo-600')) b.classList.add('text-slate-400');
            });
            if(btnEl) {
                btnEl.classList.remove('text-slate-400');
                btnEl.classList.add('active');
            }

            const mainContent = getActiveMain();
            mainContent.innerHTML = document.getElementById(`tpl-${tabName}`).innerHTML;

            if(tabName === 'dashboard') loadDashboard();
            if(tabName === 'users') loadUsers();
            if(tabName === 'withdrawals') loadWithdrawals();
            if(tabName === 'settings') loadSettings();
            if(tabName === 'broadcast') updatePreview(); 
        }

        async function loadDashboard() {
            try {
                const { count: uCount } = await dbClient.from('users').select('*', { count: 'exact', head: true });
                document.getElementById('stat-total-users').innerText = uCount || 0;

                const { count: bCount } = await dbClient.from('users').select('*', { count: 'exact', head: true }).eq('is_blocked', true);
                document.getElementById('stat-blocked').innerText = bCount || 0;

                const today = new Date().toISOString().split('T')[0];
                const { data: activeData } = await dbClient.from('click_logs').select('clicker_tg_id').gte('created_at', today);
                const uniqueActive = new Set(activeData?.map(d => d.clicker_tg_id)).size;
                document.getElementById('stat-active-users').innerText = uniqueActive || 0;

                const { data: wData } = await dbClient.from('withdrawals').select('amount, status');
                let paid = 0, pending = 0;
                if(wData) {
                    wData.forEach(w => {
                        if(w.status === 'approved') paid += w.amount;
                        if(w.status === 'pending') pending += w.amount;
                    });
                }
                document.getElementById('stat-paid').innerText = `$${paid.toFixed(2)}`;
                document.getElementById('stat-pending-amt').innerText = `$${pending.toFixed(2)}`;
            } catch(e) { console.error(e); }
        }

        async function loadUsers() {
            const tbody = document.getElementById('admin-users-list');
            try {
                const { data } = await dbClient.from('users').select('*').order('created_at', { ascending: false });
                if(!data || data.length === 0) return tbody.innerHTML = '<tr><td colspan="5" class="p-10 text-center text-slate-500">No users found.</td></tr>';

                tbody.innerHTML = '';
                data.forEach(u => {
                    const statusBadge = u.is_blocked ? '<span class="bg-red-500/10 text-red-400 border border-red-500/20 px-2 py-1 rounded-md font-bold text-[10px] uppercase tracking-wider"><i class="fa-solid fa-ban mr-1"></i> Blocked</span>' : '<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-1 rounded-md font-bold text-[10px] uppercase tracking-wider"><i class="fa-solid fa-check mr-1"></i> Active</span>';
                    const blockAction = u.is_blocked 
                        ? `<button onclick="toggleBlock('${u.id}', false)" class="bg-emerald-500/10 text-emerald-400 hover:bg-emerald-500/30 p-2.5 rounded-lg transition-colors" title="Unblock"><i class="fa-solid fa-unlock"></i></button>`
                        : `<button onclick="toggleBlock('${u.id}', true)" class="bg-amber-500/10 text-amber-400 hover:bg-amber-500/30 p-2.5 rounded-lg transition-colors" title="Block"><i class="fa-solid fa-lock"></i></button>`;

                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-800/30 transition-colors">
                            <td class="p-5 text-xs font-mono text-indigo-300 font-bold">${u.telegram_id}</td>
                            <td class="p-5 font-medium text-white">${u.first_name || 'N/A'}</td>
                            <td class="p-5 font-bold text-emerald-400">$${parseFloat(u.balance || 0).toFixed(2)}</td>
                            <td class="p-5">${statusBadge}</td>
                            <td class="p-5 text-right flex justify-end space-x-2">
                                ${blockAction}
                                <button onclick="deleteUser('${u.id}')" class="bg-red-500/10 text-red-400 hover:bg-red-500/30 p-2.5 rounded-lg transition-colors" title="Delete"><i class="fa-solid fa-trash-can"></i></button>
                            </td>
                        </tr>`;
                });
            } catch (e) { showToast("Error loading users.", "error"); }
        }

        window.toggleBlock = async function(userId, blockStatus) {
            if(!confirm(`Confirm ${blockStatus ? 'Block' : 'Unblock'} this user?`)) return;
            await dbClient.from('users').update({ is_blocked: blockStatus }).eq('id', userId);
            showToast(`User ${blockStatus ? 'blocked' : 'unblocked'} successfully.`, "success");
            loadUsers();
        }

        window.deleteUser = async function(userId) {
            if(!confirm(`WARNING: Are you sure you want to PERMANENTLY DELETE this user?`)) return;
            try {
                const { error } = await dbClient.from('users').delete().eq('id', userId);
                if(error) throw error;
                showToast("User deleted permanently.", "success");
                loadUsers();
            } catch(e) { showToast("Deletion failed: " + e.message, "error"); }
        }

        async function loadWithdrawals() {
            const tbody = document.getElementById('admin-withdraw-list');
            try {
                const { data } = await dbClient.from('withdrawals').select('*').order('created_at', { ascending: false });
                if(!data || data.length === 0) return tbody.innerHTML = '<tr><td colspan="5" class="p-10 text-center text-slate-500">No withdrawal requests found.</td></tr>';

                tbody.innerHTML = '';
                data.forEach(w => {
                    const dateStr = new Date(w.created_at).toLocaleDateString();
                    let actionHtml = '';
                    
                    if(w.status === 'pending') {
                        actionHtml = `
                            <button onclick="processWithdrawal('${w.id}', '${w.user_id}', ${w.amount}, 'approved')" class="bg-emerald-500/20 text-emerald-400 hover:bg-emerald-500/40 px-3 py-1.5 rounded-lg text-xs font-bold mr-2 transition-colors">Approve</button>
                            <button onclick="processWithdrawal('${w.id}', '${w.user_id}', ${w.amount}, 'rejected')" class="bg-red-500/20 text-red-400 hover:bg-red-500/40 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors">Reject</button>
                        `;
                    } else {
                        const color = w.status === 'approved' ? 'text-emerald-400 bg-emerald-500/10 border border-emerald-500/20' : 'text-red-400 bg-red-500/10 border border-red-500/20';
                        actionHtml = `<span class="${color} font-bold text-[10px] px-3 py-1.5 rounded-lg uppercase tracking-wider">${w.status}</span>`;
                    }

                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-800/30 transition-colors">
                            <td class="p-5 text-xs font-mono text-indigo-300 font-bold">${w.username || w.user_id.substring(0,8)}</td>
                            <td class="p-5 text-xs text-slate-300"><b class="text-white">${w.method}</b><br><span class="text-slate-500">${w.details}</span></td>
                            <td class="p-5 font-bold text-emerald-400 text-base">$${parseFloat(w.amount).toFixed(2)}</td>
                            <td class="p-5 text-xs text-slate-400 font-medium">${dateStr}</td>
                            <td class="p-5 text-center">${actionHtml}</td>
                        </tr>`;
                });
            } catch(e) {}
        }

        window.processWithdrawal = async function(wId, userId, amount, newStatus) {
            if(!confirm(`Mark this withdrawal as ${newStatus.toUpperCase()}?`)) return;
            try {
                await dbClient.from('withdrawals').update({ status: newStatus }).eq('id', wId);
                
                if(newStatus === 'rejected') {
                    const { data: u } = await dbClient.from('users').select('balance').eq('id', userId).single();
                    if(u) {
                        await dbClient.from('users').update({ balance: parseFloat(u.balance) + parseFloat(amount) }).eq('id', userId);
                    }
                }
                showToast(`Withdrawal ${newStatus} successfully!`, "success");
                loadWithdrawals();
            } catch(e) { showToast("Error updating status.", "error"); }
        }

        async function loadSettings() {
            try {
                const { data } = await dbClient.from('settings').select('*').limit(1).single();
                if(data) {
                    settingsId = data.id;
                    document.getElementById('set-cpm').value = data.cpm || 0;
                    document.getElementById('set-ref').value = data.refer_percent || 0;
                    document.getElementById('set-ads').value = data.ads_per_link || 1;
                    document.getElementById('set-timer').value = data.ad_timer || 5;
                    document.getElementById('set-payments').value = data.payment_methods || '';
                    document.getElementById('set-min-with').value = data.min_withdraw || 5;
                    document.getElementById('set-tg').value = data.tg_channel_url || '';
                    document.getElementById('set-yt').value = data.yt_channel_url || '';
                    document.getElementById('set-privacy').value = data.privacy_url || '';
                    document.getElementById('set-terms').value = data.terms_url || '';
                    document.getElementById('set-maintenance').checked = data.maintenance_mode || false;
                }
            } catch(e) {}
        }

        window.saveSettingsAction = async function() {
            const btn = document.getElementById('btn-save-settings');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Saving...`;
            
            const updates = {
                cpm: parseFloat(document.getElementById('set-cpm').value) || 0,
                refer_percent: parseInt(document.getElementById('set-ref').value) || 0,
                ads_per_link: parseInt(document.getElementById('set-ads').value) || 1,
                ad_timer: parseInt(document.getElementById('set-timer').value) || 5,
                payment_methods: document.getElementById('set-payments').value,
                min_withdraw: parseFloat(document.getElementById('set-min-with').value) || 5,
                tg_channel_url: document.getElementById('set-tg').value,
                yt_channel_url: document.getElementById('set-yt').value,
                privacy_url: document.getElementById('set-privacy').value,
                terms_url: document.getElementById('set-terms').value,
                maintenance_mode: document.getElementById('set-maintenance').checked
            };
            
            try {
                if(settingsId) await dbClient.from('settings').update(updates).eq('id', settingsId);
                else await dbClient.from('settings').insert([updates]);
                showToast("Configuration saved perfectly!", "success");
            } catch(e) { showToast("Error saving configuration.", "error"); }
            btn.innerHTML = originalHTML;
        }

        window.updatePreview = function() {
            const img = document.getElementById('bc-image')?.value || '';
            const text = document.getElementById('bc-caption')?.value || 'Message will appear here...';
            const showBtn = document.getElementById('bc-btn-toggle')?.checked;

            const pImg = document.getElementById('prev-img');
            if(img) { pImg.src = img; pImg.classList.remove('hidden'); } else { pImg.classList.add('hidden'); }
            document.getElementById('prev-text').innerHTML = text.replace(/\n/g, '<br>');
            if(showBtn) document.getElementById('prev-btn').classList.remove('hidden'); else document.getElementById('prev-btn').classList.add('hidden');
        }

        window.startBroadcast = async function() {
            const btn = document.getElementById('btn-send-broadcast');
            const imgUrl = document.getElementById('bc-image').value.trim();
            const caption = document.getElementById('bc-caption').value;
            const useBtn = document.getElementById('bc-btn-toggle').checked;
            const miniAppUrl = document.getElementById('bc-mini-app-url').value.trim();

            if(!caption && !imgUrl) return showToast("Add an image or a message to broadcast.", "error");
            if(!confirm("Send broadcast to ALL registered users?")) return;

            btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Sending...';
            document.getElementById('bc-status').classList.remove('hidden');

            try {
                const { data: users } = await dbClient.from('users').select('telegram_id').not('telegram_id', 'is', null);
                if(!users || users.length === 0) throw new Error("No users found.");
                
                const chatIds = users.map(u => u.telegram_id);
                const total = chatIds.length;
                let sent = 0; let failed = 0;

                const chunkSize = 25;
                for (let i = 0; i < total; i += chunkSize) {
                    const chunk = chatIds.slice(i, i + chunkSize);
                    const response = await fetch(VERCEL_BROADCAST_API, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_ids: chunk, image_url: imgUrl, caption: caption, use_button: useBtn, mini_app_url: miniAppUrl })
                    });
                    if(response.ok) {
                        const result = await response.json();
                        sent += result.sent || 0; failed += result.failed || 0;
                    } else { failed += chunk.length; }

                    let processed = Math.min(i + chunkSize, total);
                    let percent = Math.round((processed / total) * 100);
                    document.getElementById('bc-percent').innerText = `${percent}%`;
                    document.getElementById('bc-count').innerText = `${processed} / ${total}`;
                    document.getElementById('bc-bar').style.width = `${percent}%`;
                    document.getElementById('bc-sent').innerText = sent;
                    document.getElementById('bc-failed').innerText = failed;
                }
                showToast(`Broadcast Finished! Sent: ${sent}, Failed: ${failed}`, "info");
            } catch(e) { showToast("Error: " + e.message, "error"); }
            btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-2"></i> Launch Broadcast';
        }

        window.testTelegramBot = async function() {
            const token = document.getElementById('test-bot-token').value.trim();
            const chatId = document.getElementById('test-chat-id').value.trim();
            
            if(!token) return showToast("Please provide your Bot Token.", "error");
            if(!chatId) return showToast("Please provide a Telegram ID.", "error");

            try {
                const res = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: "✅ <b>Owner Test Passed!</b>\nYour Telegram Bot Token is valid and working perfectly with TeleAdmin.",
                        parse_mode: "HTML"
                    })
                });
                const data = await res.json();
                if(data.ok) {
                    showToast("Test message sent successfully! Check Telegram.", "success");
                } else {
                    showToast("Bot Error: " + data.description, "error");
                }
            } catch(e) {
                showToast("Network Error: Could not connect to Telegram API.", "error");
            }
        }

        window.testAds = function() {
            const resultBox = document.getElementById('ad-test-result');
            
            if(typeof show_11645333 === 'function') {
                resultBox.classList.remove('hidden');
                resultBox.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-emerald-400 mr-2 text-lg"></i> <span class="text-white">Connecting to Monetag Servers...</span>';
                
                show_11645333().then(() => {
                    resultBox.innerHTML = '<div class="text-emerald-400"><i class="fa-solid fa-check-circle mr-2 text-lg"></i> <b>Test Success!</b> Ad requested and displayed perfectly.</div>';
                    showToast("Ad triggered successfully!", "success");
                }).catch(err => {
                    resultBox.innerHTML = `<div class="text-amber-400"><i class="fa-solid fa-triangle-exclamation mr-2 text-lg"></i> <b>Ad Interrupted:</b> ${err.message || 'Blocker detected, or no fill available right now.'}</div>`;
                    showToast("Ad test interrupted (Check blocker/fill).", "info");
                });
            } else {
                resultBox.classList.remove('hidden');
                resultBox.innerHTML = '<div class="text-red-400"><i class="fa-solid fa-xmark-circle mr-2 text-lg"></i> <b>Test Failed:</b> Monetag SDK script is missing or blocked by browser.</div>';
                showToast("Ad SDK not loaded properly.", "error");
            }
        }
    </script>
</body>
