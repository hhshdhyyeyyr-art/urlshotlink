<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeleShort - Premium Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src='//libtl.com/sdk.js' data-zone='11645333' data-sdk='show_11645333'></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #030712; color: #f8fafc; }
        .glass-panel { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 1.25rem; }
        .premium-text { background: linear-gradient(to right, #818cf8, #2dd4bf); -webkit-background-clip: text; color: transparent; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 10px; }
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast { padding: 16px 24px; border-radius: 12px; font-size: 14px; font-weight: 600; color: white; display: flex; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transform: translateX(120%); opacity: 0; transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55); backdrop-filter: blur(10px); background: rgba(15,23,42,0.9); border:1px solid rgba(255,255,255,0.1); }
        .toast.show { transform: translateX(0); opacity: 1; }
        .nav-btn.active { background: linear-gradient(135deg, #4f46e5, #3b82f6); color: white; box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4); }
    </style>
</head>
<body class="flex h-screen overflow-hidden relative">
    
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-indigo-600/20 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-pink-600/10 rounded-full blur-[120px] pointer-events-none"></div>

    <div id="toast-container"></div>

    <div id="login-screen" class="absolute inset-0 z-50 bg-[#030712]/90 backdrop-blur-xl flex items-center justify-center transition-all duration-500">
        <div class="glass-panel p-10 max-w-sm w-full text-center shadow-[0_0_50px_rgba(79,70,229,0.15)] border-indigo-500/30">
            <div class="w-20 h-20 mx-auto bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center mb-6 shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-fingerprint text-4xl text-white"></i>
            </div>
            <h2 class="text-3xl font-black mb-2 premium-text">Admin Portal</h2>
            <input type="password" id="admin-password" placeholder="••••••••" class="w-full bg-black/40 border border-white/10 text-white px-4 py-4 rounded-xl mb-6 focus:outline-none focus:border-indigo-500 text-center tracking-[0.5em] text-lg shadow-inner">
            <button id="btn-login" class="w-full bg-gradient-to-r from-indigo-600 to-blue-500 text-white font-bold py-4 rounded-xl transition-all shadow-lg active:scale-95">Secure Login <i class="fa-solid fa-arrow-right ml-2"></i></button>
        </div>
    </div>

    <div id="admin-dashboard" class="flex w-full h-full hidden z-10">
        <aside class="w-72 bg-black/30 backdrop-blur-md border-r border-white/5 p-6 hidden md:flex flex-col">
            <div class="flex items-center mb-10 px-2">
                <div class="w-10 h-10 bg-indigo-500 rounded-lg flex items-center justify-center mr-3 shadow-lg shadow-indigo-500/30"><i class="fa-solid fa-bolt text-white"></i></div>
                <div><h1 class="text-xl font-bold text-white">TeleAdmin</h1><div class="flex items-center text-[10px] text-emerald-400"><div class="w-2 h-2 bg-emerald-500 rounded-full mr-1 animate-pulse"></div> DB Connected</div></div>
            </div>
            <nav class="space-y-3 flex-1">
                <button class="nav-btn w-full text-left px-5 py-3.5 rounded-xl font-medium text-slate-400 hover:bg-white/5 transition-all flex items-center active" onclick="switchTab('dashboard', this)"><i class="fa-solid fa-chart-pie w-6"></i> Dashboard</button>
                <button class="nav-btn w-full text-left px-5 py-3.5 rounded-xl font-medium text-slate-400 hover:bg-white/5 transition-all flex items-center" onclick="switchTab('users', this)"><i class="fa-solid fa-users w-6"></i> Users</button>
                <button class="nav-btn w-full text-left px-5 py-3.5 rounded-xl font-medium text-slate-400 hover:bg-white/5 transition-all flex items-center" onclick="switchTab('withdrawals', this)"><i class="fa-solid fa-money-bill-transfer w-6"></i> Withdrawals</button>
                <button class="nav-btn w-full text-left px-5 py-3.5 rounded-xl font-medium text-slate-400 hover:bg-white/5 transition-all flex items-center" onclick="switchTab('settings', this)"><i class="fa-solid fa-gear w-6"></i> Settings</button>
                <button class="nav-btn w-full text-left px-5 py-3.5 rounded-xl font-medium text-slate-400 hover:bg-white/5 transition-all flex items-center" onclick="switchTab('broadcast', this)"><i class="fa-solid fa-bullhorn w-6 text-amber-400"></i> Broadcast</button>
                <button class="nav-btn w-full text-left px-5 py-3.5 rounded-xl font-medium text-slate-400 hover:bg-white/5 transition-all flex items-center" onclick="switchTab('tools', this)"><i class="fa-solid fa-gamepad w-6 text-pink-400"></i> Game & Tools</button>
            </nav>
            <button class="w-full text-left p-4 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-400 transition flex items-center justify-center font-bold" onclick="location.reload()"><i class="fa-solid fa-power-off mr-2"></i> Lock Panel</button>
        </aside>

        <!-- Main Desktop view -->
        <main id="desktop-main" class="flex-1 p-10 overflow-y-auto bg-transparent relative z-10"></main>
    </div>

    <template id="tpl-dashboard">
        <h2 class="text-3xl font-black mb-8 premium-text">System Overview</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
            <div class="glass-panel p-6 shadow-xl flex justify-between items-center border-t-4 border-t-indigo-500">
                <div><div class="text-slate-400 text-xs font-bold uppercase mb-1 tracking-wider">Total Users</div><div class="text-4xl font-black text-white" id="stat-total-users">0</div></div>
                <div class="bg-indigo-500/20 w-14 h-14 rounded-2xl flex items-center justify-center"><i class="fa-solid fa-users text-indigo-400 text-2xl"></i></div>
            </div>
            <div class="glass-panel p-6 shadow-xl flex justify-between items-center border-t-4 border-t-emerald-500">
                <div><div class="text-slate-400 text-xs font-bold uppercase mb-1 tracking-wider">Active Today</div><div class="text-4xl font-black text-white" id="stat-active-users">0</div></div>
                <div class="bg-emerald-500/20 w-14 h-14 rounded-2xl flex items-center justify-center"><i class="fa-solid fa-bolt text-emerald-400 text-2xl"></i></div>
            </div>
            <div class="glass-panel p-6 shadow-xl flex justify-between items-center border-t-4 border-t-amber-500">
                <div><div class="text-slate-400 text-xs font-bold uppercase mb-1 tracking-wider">Pending Payouts</div><div class="text-4xl font-black text-amber-400" id="stat-pending-amt">$0.00</div></div>
                <div class="bg-amber-500/20 w-14 h-14 rounded-2xl flex items-center justify-center"><i class="fa-solid fa-clock text-amber-400 text-2xl"></i></div>
            </div>
        </div>
    </template>

    <template id="tpl-users">
        <h2 class="text-3xl font-black mb-6 premium-text">User Management</h2>
        <div class="glass-panel overflow-hidden">
            <table class="w-full text-left text-sm whitespace-nowrap">
                <thead class="bg-black/40 text-slate-400 uppercase text-[10px] tracking-wider">
                    <tr><th class="p-5">TG ID</th><th class="p-5">Name</th><th class="p-5">Balance</th><th class="p-5">Status</th><th class="p-5 text-right">Action</th></tr>
                </thead>
                <tbody id="admin-users-list" class="divide-y divide-white/5">
                    <tr><td colspan="5" class="p-10 text-center text-slate-400"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </template>

    <template id="tpl-withdrawals">
        <h2 class="text-3xl font-black mb-6 premium-text">Withdrawal Requests</h2>
        <div class="glass-panel overflow-hidden">
            <table class="w-full text-left text-sm whitespace-nowrap">
                <thead class="bg-black/40 text-slate-400 uppercase text-[10px] tracking-wider">
                    <tr><th class="p-5">User</th><th class="p-5">Details</th><th class="p-5">Amount</th><th class="p-5 text-center">Action</th></tr>
                </thead>
                <tbody id="admin-withdraw-list" class="divide-y divide-white/5">
                    <tr><td colspan="5" class="p-10 text-center text-slate-400"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </template>

    <template id="tpl-settings">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-3xl font-black premium-text">App Customization</h2>
            <label class="flex items-center space-x-3 cursor-pointer bg-white/5 px-5 py-2.5 rounded-xl border border-white/10">
                <span class="text-xs font-bold text-slate-300 uppercase tracking-wider">Maintenance Mode</span>
                <input type="checkbox" id="set-maintenance" class="w-5 h-5 accent-red-500">
            </label>
        </div>
        <div class="glass-panel p-8 max-w-4xl">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div><label class="block text-[11px] font-bold text-slate-400 mb-2 uppercase">Global CPM ($)</label><input type="number" step="0.01" id="set-cpm" class="w-full bg-black/30 border border-white/10 rounded-lg p-3.5 text-white outline-none focus:border-indigo-500"></div>
                <div><label class="block text-[11px] font-bold text-slate-400 mb-2 uppercase">Referral Bonus (%)</label><input type="number" id="set-ref" class="w-full bg-black/30 border border-white/10 rounded-lg p-3.5 text-white outline-none focus:border-indigo-500"></div>
                <div><label class="block text-[11px] font-bold text-slate-400 mb-2 uppercase">Min. Withdraw ($)</label><input type="number" step="0.5" id="set-min-with" class="w-full bg-black/30 border border-white/10 rounded-lg p-3.5 text-white outline-none focus:border-indigo-500"></div>
            </div>
            <div class="border-t border-white/5 pt-8 mb-8">
                <h3 class="text-sm font-bold text-indigo-400 mb-5 uppercase tracking-wider"><i class="fa-solid fa-link mr-2"></i> Social Links</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div><label class="block text-[11px] font-bold text-slate-400 mb-2 uppercase">Telegram Channel</label><input type="url" id="set-tg" class="w-full bg-black/30 border border-white/10 rounded-lg p-3.5 text-white outline-none"></div>
                    <div><label class="block text-[11px] font-bold text-slate-400 mb-2 uppercase">YouTube Channel</label><input type="url" id="set-yt" class="w-full bg-black/30 border border-white/10 rounded-lg p-3.5 text-white outline-none"></div>
                </div>
            </div>
            <button onclick="saveSettingsAction()" class="w-full bg-indigo-600 hover:bg-indigo-500 py-4 rounded-xl font-bold text-white shadow-xl">Save Configuration</button>
        </div>
    </template>

    <template id="tpl-broadcast">
        <h2 class="text-3xl font-black mb-6 premium-text">Mass Broadcast</h2>
        <div class="glass-panel p-8 max-w-2xl">
            <input type="url" id="bc-image" placeholder="Image URL (Optional)" class="w-full bg-black/30 border border-white/10 rounded-lg p-3.5 text-white mb-5 outline-none">
            <textarea id="bc-caption" rows="5" placeholder="Message HTML..." class="w-full bg-black/30 border border-white/10 rounded-lg p-3.5 text-white mb-5 outline-none"></textarea>
            <button onclick="startBroadcast()" class="w-full bg-amber-600 hover:bg-amber-500 py-4 rounded-xl font-bold text-white shadow-xl">Launch Broadcast</button>
        </div>
    </template>

    <template id="tpl-tools">
        <h2 class="text-3xl font-black mb-6 text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-indigo-400">Games & Testing Tools</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Monetag Tester -->
            <div class="glass-panel p-8 border border-indigo-500/30">
                <h3 class="text-xl font-black text-white mb-2"><i class="fa-solid fa-money-bill-wave text-indigo-400 mr-2"></i>Monetag Ads Test</h3>
                <p class="text-xs text-slate-400 mb-6">Test your monetag zone integration.</p>
                <button onclick="testAds()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-xl active:scale-95">Trigger Ad</button>
            </div>
            
            <!-- Game Insights Info -->
            <div class="glass-panel p-8 border border-pink-500/30">
                <h3 class="text-xl font-black text-white mb-2"><i class="fa-solid fa-gamepad text-pink-400 mr-2"></i>Play Zone Engine</h3>
                <p class="text-xs text-slate-400 mb-6">4 Premium HTML5 games are currently active in the User App. Monetization is handled automatically via pre-game Ads.</p>
                <div class="bg-black/30 p-4 rounded-xl border border-white/10 flex justify-between items-center">
                    <div>
                        <div class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Status</div>
                        <div class="text-emerald-400 font-bold">100% Operational</div>
                    </div>
                    <i class="fa-solid fa-server text-2xl text-emerald-500"></i>
                </div>
            </div>
        </div>
    </template>

    <script>
        function showToast(m, t='info') {
            const c = document.getElementById('toast-container');
            const d = document.createElement('div');
            let i = t === 'success' ? '<i class="fa-solid fa-check text-emerald-400 mr-2"></i>' : '<i class="fa-solid fa-info text-indigo-400 mr-2"></i>';
            d.className = `toast toast-${t}`; d.innerHTML = `${i} ${m}`; c.appendChild(d);
            setTimeout(() => d.classList.add('show'), 10);
            setTimeout(() => { d.classList.remove('show'); setTimeout(() => d.remove(), 400); }, 3000);
        }

        const SUPABASE_URL = 'https://hlwnbizaaabtoafzbbax.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_12kTf5tqSSw1CrVi7OFJMg_I6h0r1m9';
        const VERCEL_BROADCAST_API = 'https://urlshotlink.vercel.app/api/broadcast'; 
        const ADMIN_PASSWORD = "admin"; 
        
        let dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('btn-login').addEventListener('click', () => {
            if(document.getElementById('admin-password').value === ADMIN_PASSWORD) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                switchTab('dashboard', document.querySelector('.nav-btn'));
                showToast("Login Successful!", "success");
            } else { showToast("Wrong Password", "error"); }
        });

        window.switchTab = function(tName, btn) {
            document.querySelectorAll('.nav-btn').forEach(b => { b.classList.remove('active', 'bg-white/5'); b.classList.add('text-slate-400'); });
            if(btn) { btn.classList.remove('text-slate-400'); btn.classList.add('active'); }
            document.getElementById('desktop-main').innerHTML = document.getElementById(`tpl-${tName}`).innerHTML;
            if(tName === 'dashboard') loadDashboard(); if(tName === 'users') loadUsers();
            if(tName === 'withdrawals') loadWithdrawals(); if(tName === 'settings') loadSettings();
        }

        async function loadDashboard() {
            try {
                const { count: uCount } = await dbClient.from('users').select('*', { count: 'exact', head: true }); document.getElementById('stat-total-users').innerText = uCount || 0;
                const { data: activeData } = await dbClient.from('click_logs').select('clicker_tg_id').gte('created_at', new Date().toISOString().split('T')[0]);
                document.getElementById('stat-active-users').innerText = new Set(activeData?.map(d => d.clicker_tg_id)).size || 0;
                const { data: wData } = await dbClient.from('withdrawals').select('amount, status'); let p=0;
                if(wData) wData.forEach(w => { if(w.status === 'pending') p += w.amount; });
                document.getElementById('stat-pending-amt').innerText = `$${p.toFixed(2)}`;
            } catch(e) {}
        }

        async function loadUsers() {
            const tb = document.getElementById('admin-users-list');
            try {
                const { data } = await dbClient.from('users').select('*').order('created_at', { ascending: false }); tb.innerHTML = '';
                data.forEach(u => {
                    tb.innerHTML += `<tr class="hover:bg-white/5"><td class="p-5 font-bold">${u.telegram_id}</td><td class="p-5">${u.first_name}</td><td class="p-5 text-emerald-400 font-bold">$${parseFloat(u.balance||0).toFixed(2)}</td><td class="p-5">${u.is_blocked?'Blocked':'Active'}</td><td class="p-5 text-right"><button onclick="toggleBlock('${u.id}', ${!u.is_blocked})" class="bg-indigo-500/20 px-3 py-1 rounded text-xs text-indigo-400">Toggle Block</button></td></tr>`;
                });
            } catch (e) {}
        }
        window.toggleBlock = async function(id, st) { await dbClient.from('users').update({ is_blocked: st }).eq('id', id); loadUsers(); }

        async function loadWithdrawals() {
            const tb = document.getElementById('admin-withdraw-list');
            try {
                const { data } = await dbClient.from('withdrawals').select('*').order('created_at', { ascending: false }); tb.innerHTML = '';
                data.forEach(w => {
                    let act = w.status === 'pending' ? `<button onclick="processWithdrawal('${w.id}','${w.user_id}',${w.amount},'approved')" class="text-emerald-400 mr-2">Approve</button><button onclick="processWithdrawal('${w.id}','${w.user_id}',${w.amount},'rejected')" class="text-red-400">Reject</button>` : w.status;
                    tb.innerHTML += `<tr class="hover:bg-white/5"><td class="p-5 font-bold">${w.username}</td><td class="p-5">${w.method}: ${w.details}</td><td class="p-5 text-emerald-400 font-bold">$${w.amount}</td><td class="p-5 text-center">${act}</td></tr>`;
                });
            } catch(e) {}
        }
        window.processWithdrawal = async function(wId, uId, amt, stat) {
            await dbClient.from('withdrawals').update({ status: stat }).eq('id', wId);
            if(stat === 'rejected') { const { data: u } = await dbClient.from('users').select('balance').eq('id', uId).single(); await dbClient.from('users').update({ balance: parseFloat(u.balance) + parseFloat(amt) }).eq('id', uId); }
            loadWithdrawals(); showToast("Updated!");
        }

        window.testAds = function() {
            if(typeof show_11645333 === 'function') {
                showToast("Loading Ad...", "info");
                show_11645333().then(() => showToast("Ad Loaded Successfully!", "success")).catch(() => showToast("Ad Failed (Blocker?)", "error"));
            } else showToast("SDK Not Found", "error");
        }
    </script>
</body>
</html>
